<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Place Sphere - Green (Nature) with curved diagonal lines, tilted -->
  <g stroke="#5CB85C" stroke-width="1.5" fill="none">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="42"/>
    <!-- Diagonal curved lines - tilted opposite direction -->
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(30 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(75 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="14" transform="rotate(90 50 50)"/>
    <!-- Vertical curved lines -->
    <ellipse cx="50" cy="50" rx="14" ry="42" transform="rotate(30 50 50)"/>
    <ellipse cx="50" cy="50" rx="14" ry="42" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="14" ry="42" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="50" rx="14" ry="42" transform="rotate(120 50 50)"/>
  </g>
</svg>
