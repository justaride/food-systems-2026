<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Lab Sphere - Red (Society) with horizontal rings/ellipses -->
  <g stroke="#D0422A" stroke-width="1.5" fill="none">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="42"/>
    <!-- Horizontal rings at different heights -->
    <ellipse cx="50" cy="50" rx="42" ry="8"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(15 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(30 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(45 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(75 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(90 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(105 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(120 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(135 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(150 50 50)"/>
    <ellipse cx="50" cy="50" rx="42" ry="8" transform="rotate(165 50 50)"/>
  </g>
</svg>
