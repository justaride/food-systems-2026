"257.6545454545454" font-size="13" font-weight="700" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">£62–173/t</text><text x="260" y="362" font-size="13" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Blandede biprodukter</text><rect x="460" y="122.54545454545456" width="120" height="112.90909090909088" fill="#116b55" opacity="0.85" rx="4"/><text x="520" y="112.54545454545456" font-size="13" font-weight="700" fill="#116b55" text-anchor="middle" font-family="Inter, system-ui, sans-serif">£250–520/t</text><text x="520" y="362" font-size="13" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Segregerte fraksjoner</text><path d="M 330 277.27272727272725 C 390 120, 430 120, 450 181.0909090909091" fill="none" stroke="#aa3f31" stroke-width="2" marker-end="url(#ah2)"/><defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#aa3f31"/></marker></defs><text x="390" y="108" font-size="14" font-weight="800" fill="#aa3f31" text-anchor="middle" font-family="Inter, system-ui, sans-serif">3–7×</text><text x="40" y="392" font-size="10" fill="#646057" font-family="Inter, system-ui, sans-serif">Caveat: 2019-survey (Enscape Consulting 31.03.2020, republisert av Zero Waste Scotland 20.02.2025). All bruk merkes med årstall.</text><text x="40" y="406" font-size="10" fill="#646057" font-family="Inter, system-ui, sans-serif">Norsk parallell: 89 % av restråstoffet utnyttes, men 66 % går til fôr og 19 % til biogass (SINTEF/FHF 2024) — gapet er verdimiks, ikke utnyttelse.</text></svg>