<svg viewBox="0 0 820 460" xmlns="http://www.w3.org/2000/svg"><rect width="820" height="460" fill="#faf8f2"/><text x="40" y="36" font-size="19" font-weight="700" fill="#191814" font-family="Inter, system-ui, sans-serif">Kakao: nordisk eksponering mot Elfenbenskysten går via EU</text><text x="40" y="56" font-size="12" fill="#646057" font-family="Inter, system-ui, sans-serif">Direkteimport CI → Norden 2024: 0 kg råbønner (HS 1801). Eksponeringen ligger i EU-prosessering og merkevarekjeder.</text><rect x="40" y="150" width="150" height="120" fill="#e6f3ed" stroke="#116b55" rx="6"/><text x="115" y="180" font-size="14" font-weight="700" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Côte d’Ivoire</text><text x="115" y="200" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">~40 % av global</text><text x="115" y="214" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">kakaoproduksjon</text><text x="115" y="240" font-size="10" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">EU tar 66,2 % av</text><text x="115" y="254" font-size="10" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">CI-eksporten (2024)</text><rect x="250" y="110" width="200" height="200" fill="#e7f0f6" stroke="#285f88" rx="6"/><text x="350" y="140" font-size="14" font-weight="700" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">EU-prosessering</text><text x="350" y="162" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Nederland 42 % · Belgia 17 %</text><text x="350" y="176" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Tyskland 14 % (av EU-import fra CI)</text><text x="350" y="200" font-size="11" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Cargill (Zaandam)</text><text x="350" y="216" font-size="11" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">ofi/Olam (Koog a/d Zaan)</text><text x="350" y="232" font-size="11" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Barry Callebaut (Wieze)</text><text x="350" y="256" font-size="10" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">DDS-plikt under EUDR</text><text x="350" y="270" font-size="10" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">fra 30.12.2026</text><rect x="510" y="90" width="200" height="240" fill="#fff1cf" stroke="#8b6417" rx="6"/><text x="610" y="120" font-size="14" font-weight="700" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Nordiske merkevarer</text><text x="610" y="144" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Freia/Mondelez — Cocoa Life, CI</text><text x="610" y="160" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Nidar/Orkla — RA, mass balance</text><text x="610" y="176" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Fazer — eget CI-bondeprogram</text><text x="610" y="192" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Cloetta — RA, land uspesifisert</text><text x="610" y="208" font-size="10" font-weight="400" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Toms — Ghana-spor, ikke CI</text><text x="610" y="236" font-size="9" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">(egenrapportert sourcing,</text><text x="610" y="250" font-size="9" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">programnivå — ikke produktnivå)</text><text x="610" y="276" font-size="11" font-weight="700" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Norsk dagligvare</text><text x="610" y="292" font-size="9" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">kun videreforedlede varer</text><text x="610" y="306" font-size="9" font-weight="400" fill="#646057" text-anchor="middle" font-family="Inter, system-ui, sans-serif">omfattes av norsk EUDR-gj.føring</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 z" fill="#191814"/></marker></defs><line x1="190" y1="210" x2="245" y2="210" stroke="#191814" stroke-width="3" marker-end="url(#ah)"/><line x1="450" y1="210" x2="505" y2="210" stroke="#191814" stroke-width="3" marker-end="url(#ah)"/><path d="M 115 280 C 115 400, 610 400, 610 340" fill="none" stroke="#aa3f31" stroke-width="2" stroke-dasharray="6,5"/><text x="360" y="392" font-size="11" font-weight="700" fill="#aa3f31" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Direkteimport CI → Norden 2024: 0 kg råbønner; største post 36 t kakaosmør (Norge)</text><text x="40" y="446" font-size="10" fill="#646057" font-family="Inter, system-ui, sans-serif">Kilder (uvalidert intern syntese): Comtrade-uttrekk 12.06, Trase 2026, CBI 2026, selskapenes egne bærekraftsrapporter — se uttak-07.</text></svg>