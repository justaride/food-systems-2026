<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg"><rect width="760" height="460" fill="#faf8f2"/><text x="40" y="36" font-size="19" font-weight="700" fill="#191814" font-family="Inter, system-ui, sans-serif">Proteinfôr-symmetrien: Norge og Finland importerer like mye raps</text><text x="40" y="56" font-size="12" fill="#646057" font-family="Inter, system-ui, sans-serif">Import fra verden 2024, 1000 tonn. Forskjellen er soyaformen: Finland kjøper mel — Norge kjøper bønner og presser selv.</text><line x1="70" y1="370" x2="710" y2="370" stroke="#191814" stroke-width="1.2"/><line x1="70" y1="370" x2="710" y2="370" stroke="#ece6dc"/><text x="62" y="374" font-size="10" fill="#646057" text-anchor="end" font-family="Inter, system-ui, sans-serif">0</text><line x1="70" y1="297.77777777777777" x2="710" y2="297.77777777777777" stroke="#ece6dc"/><text x="62" y="301.77777777777777" font-size="10" fill="#646057" text-anchor="end" font-family="Inter, system-ui, sans-serif">100</text><line x1="70" y1="225.55555555555554" x2="710" y2="225.55555555555554" stroke="#ece6dc"/><text x="62" y="229.55555555555554" font-size="10" fill="#646057" text-anchor="end" font-family="Inter, system-ui, sans-serif">200</text><line x1="70" y1="153.33333333333331" x2="710" y2="153.33333333333331" stroke="#ece6dc"/><text x="62" y="157.33333333333331" font-size="10" fill="#646057" text-anchor="end" font-family="Inter, system-ui, sans-serif">300</text><rect x="105" y="220.5" width="64" height="149.5" fill="#116b55" rx="3"/><text x="137" y="212.5" font-size="12" font-weight="700" fill="#116b55" text-anchor="middle" font-family="Inter, system-ui, sans-serif">207</text><rect x="191" y="214" width="64" height="156" fill="#285f88" rx="3"/><text x="223" y="206" font-size="12" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">216</text><text x="180" y="390" font-size="12" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Rapsmel (HS 2306)</text><rect x="325" y="366.53333333333336" width="64" height="3.4666666666666663" fill="#116b55" rx="3"/><text x="357" y="358.53333333333336" font-size="12" font-weight="700" fill="#116b55" text-anchor="middle" font-family="Inter, system-ui, sans-serif">4,8</text><rect x="411" y="280.44444444444446" width="64" height="89.55555555555556" fill="#285f88" rx="3"/><text x="443" y="272.44444444444446" font-size="12" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">124</text><text x="400" y="390" font-size="12" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Soyamel (HS 2304)</text><rect x="545" y="119.38888888888889" width="64" height="250.61111111111111" fill="#116b55" rx="3"/><text x="577" y="111.38888888888889" font-size="12" font-weight="700" fill="#116b55" text-anchor="middle" font-family="Inter, system-ui, sans-serif">347</text><rect x="631" y="365.7" width="64" height="4.3" fill="#285f88" rx="3"/><text x="663" y="357.7" font-size="12" font-weight="700" fill="#285f88" text-anchor="middle" font-family="Inter, system-ui, sans-serif">6,0</text><text x="620" y="390" font-size="12" fill="#191814" text-anchor="middle" font-family="Inter, system-ui, sans-serif">Soyabønner (HS 1201)</text><rect x="540" y="80" width="14" height="14" fill="#116b55" rx="2"/><text x="560" y="92" font-size="12" fill="#191814" font-family="Inter, system-ui, sans-serif">Norge</text><rect x="620" y="80" width="14" height="14" fill="#285f88" rx="2"/><text x="640" y="92" font-size="12" fill="#191814" font-family="Inter, system-ui, sans-serif">Finland</text><text x="40" y="432" font-size="10" fill="#646057" font-family="Inter, system-ui, sans-serif">Norsk 1201-strøm fordeles på fiskefôr, husdyrfôr og mat (Denofa-modellen) — splitten er ikke dokumentert her. Ikke si «347 kt soya til husdyrfôr».</text><text x="40" y="446" font-size="10" fill="#646057" font-family="Inter, system-ui, sans-serif">Internt tallgrunnlag: