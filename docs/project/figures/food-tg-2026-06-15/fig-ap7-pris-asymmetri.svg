<svg viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif">
<rect width="580" height="360" fill="#ffffff"/>
<text x="290" y="24" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Pris-asymmetri i fiskeforedling — retning bekreftet, signifikans ikke</text>
<text x="290" y="41" font-size="10" fill="#78716c" text-anchor="middle">Distribuert lag 0–3 i log-differanser. SSB 03024 (lakseråpris) → SSB 12462 SNN102 (foredlings-PPI), 2019M01–2026M07, n=91.</text>
<text x="290" y="54" font-size="9.5" fill="#a8a29e" text-anchor="middle">Reprodusert med scripts/analyze-price-asymmetry.ts 2026-08-24. Revidert: erstatter versjonen som viste «NARDL t = 14,0».</text>

<!-- ============ Venstre: kumulativt gjennomslag ============ -->
<text x="40" y="80" font-size="11.5" font-weight="600" fill="#0f172a">Kumulativt gjennomslag</text>
<text x="40" y="94" font-size="9.5" fill="#78716c">marked i alt, uten valutakontroll</text>
<line x1="120" y1="104" x2="120" y2="230" stroke="#e7e5e4" stroke-width="1"/>
<line x1="120" y1="230" x2="300" y2="230" stroke="#e7e5e4" stroke-width="1"/>
<!-- skala: 414,3 px per enhet; grunnlinje y=230 -->
<!-- opp 0,290 -> h=120 -->
<rect x="150" y="110" width="48" height="120" rx="2" fill="#075985"/>
<text x="174" y="104" font-size="11" font-weight="600" fill="#075985" text-anchor="middle">+0,290</text>
<text x="174" y="245" font-size="10" fill="#44403c" text-anchor="middle">ved prisøkning</text>
<text x="174" y="257" font-size="9" fill="#a8a29e" text-anchor="middle">t = 3,3</text>
<!-- ned 0,085 -> h=35 -->
<rect x="232" y="195" width="48" height="35" rx="2" fill="#bae6fd"/>
<text x="256" y="189" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">+0,085</text>
<text x="256" y="245" font-size="10" fill="#44403c" text-anchor="middle">ved prisfall</text>
<text x="256" y="257" font-size="9" fill="#a8a29e" text-anchor="middle">t = 1,0</text>

<text x="40" y="277" font-size="10.5" font-weight="600" fill="#0f172a">Asymmetri = +0,205</text>
<text x="40" y="291" font-size="10.5" fill="#b45309">t = 1,25 (HAC 1,63) — ikke signifikant</text>
<text x="40" y="305" font-size="9.5" fill="#78716c">Retningen er som ventet, men forskjellen mellom de to</text>
<text x="40" y="316" font-size="9.5" fill="#78716c">søylene er ikke statistisk skilt fra null.</text>

<!-- ============ Høyre: asymmetri per marked, før/etter valutakontroll ============ -->
<text x="330" y="80" font-size="11.5" font-weight="600" fill="#0f172a">Asymmetri per marked</text>
<text x="330" y="94" font-size="9.5" fill="#78716c"><tspan fill="#075985" font-weight="600">mørk</tspan> = ukontrollert, <tspan fill="#0369a1" font-weight="600">lys</tspan> = kontrollert for USDNOK</text>

<line x1="338" y1="210" x2="558" y2="210" stroke="#e7e5e4" stroke-width="1"/>
<!-- skala: 333,3 px per enhet; grunnlinje y=210 -->

<!-- Hjemmemarked: 0,109 -> h=36 ; 0,019 -> h=6 -->
<rect x="349" y="174" width="26" height="36" rx="2" fill="#075985"/>
<text x="362" y="169" font-size="8.5" fill="#075985" text-anchor="middle">0,109</text>
<rect x="379" y="204" width="26" height="6" rx="1" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.75"/>
<text x="392" y="199" font-size="8.5" fill="#0369a1" text-anchor="middle">0,019</text>
<text x="377" y="224" font-size="9.5" fill="#44403c" text-anchor="middle">Hjemme</text>

<!-- I alt: 0,205 -> h=68 ; 0,079 -> h=26 -->
<rect x="421" y="142" width="26" height="68" rx="2" fill="#075985"/>
<text x="434" y="137" font-size="8.5" fill="#075985" text-anchor="middle">0,205</text>
<rect x="451" y="184" width="26" height="26" rx="2" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.75"/>
<text x="464" y="179" font-size="8.5" fill="#0369a1" text-anchor="middle">0,079</text>
<text x="449" y="224" font-size="9.5" fill="#44403c" text-anchor="middle">I alt</text>

<!-- Eksport: 0,280 -> h=93 ; 0,122 -> h=41 -->
<rect x="493" y="117" width="26" height="93" rx="2" fill="#075985"/>
<text x="506" y="112" font-size="8.5" fill="#075985" text-anchor="middle">0,280</text>
<rect x="523" y="169" width="26" height="41" rx="2" fill="#bae6fd" stroke="#7dd3fc" stroke-width="0.75"/>
<text x="536" y="164" font-size="8.5" fill="#0369a1" text-anchor="middle">0,122</text>
<text x="521" y="224" font-size="9.5" fill="#44403c" text-anchor="middle">Eksport</text>

<text x="330" y="248" font-size="9.5" fill="#44403c">Valutakontroll fjerner rundt 60 % av asymmetrien. Den er</text>
<text x="330" y="260" font-size="9.5" fill="#44403c">minst i hjemmemarkedet og størst i eksportmarkedet —</text>
<text x="330" y="272" font-size="9.5" fill="#44403c">mønsteret man venter hvis mye av den er NOK-svekkelse.</text>
<text x="330" y="289" font-size="9" fill="#a8a29e">Ingen av markedene er signifikant, kontrollert eller ikke</text>
<text x="330" y="300" font-size="9" fill="#a8a29e">(t = 0,58 / 1,25 / 1,37 ukontrollert).</text>

<!-- ============ Forbehold ============ -->
<line x1="40" y1="324" x2="540" y2="324" stroke="#fcd34d" stroke-width="1"/>
<text x="290" y="338" font-size="8.5" text-anchor="middle" fill="#92400e"><tspan font-weight="600" fill="#b45309">Hvorfor tallet er endret:</tspan> juni-versjonens «t = 14,0» kom fra en nivåregresjon på partialsummer av to trendende serier.</text>
<text x="290" y="350" font-size="8.5" text-anchor="middle" fill="#92400e">Samme spesifikasjon gir t = 28,6 (R² = 0,85) for fôr → lakspris, med negative koeffisienter. Bruk differansespesifikasjonen.</text>
</svg>
