<svg viewBox="0 0 580 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif">
<rect width="580" height="360" fill="#ffffff"/>
<text x="290" y="26" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Havbruk — sjøbasert MTB-konsentrasjon og land-RAS-fortynningen</text>
<text x="290" y="44" font-size="10.5" fill="#78716c" text-anchor="middle">Fiskeridirektoratet Akvakulturregister (15.06.2026). MTB = maksimalt tillatt biomasse (tildelt kapasitet).</text>

<!-- Left panel: operator MTB shares, sjøbasert n=92 -->
<text x="40" y="74" font-size="11.5" font-weight="600" fill="#0f172a">Sjøbasert MTB-andel per konsern (n=92)</text>
<!-- bars: x0=40, scale 220px / 22% -->
<text x="34" y="98" font-size="10.5" fill="#44403c" text-anchor="end">Mowi</text>
<rect x="40" y="88" width="198" height="13" rx="2" fill="#075985"/><text x="243" y="98" font-size="9.5" fill="#075985">19,8 %</text>
<text x="34" y="118" font-size="10.5" fill="#44403c" text-anchor="end">SalMar</text>
<rect x="40" y="108" width="161" height="13" rx="2" fill="#0369a1"/><text x="206" y="118" font-size="9.5" fill="#0369a1">16,1 %</text>
<text x="34" y="138" font-size="10.5" fill="#44403c" text-anchor="end">Lerøy</text>
<rect x="40" y="128" width="115" height="13" rx="2" fill="#0284c7"/><text x="160" y="138" font-size="9.5" fill="#0284c7">11,5 %</text>
<text x="34" y="158" font-size="10.5" fill="#44403c" text-anchor="end">Cermaq</text>
<rect x="40" y="148" width="95" height="13" rx="2" fill="#0ea5e9"/><text x="140" y="158" font-size="9.5" fill="#0ea5e9">9,5 %</text>
<text x="34" y="178" font-size="10.5" fill="#44403c" text-anchor="end">Nordlaks</text>
<rect x="40" y="168" width="38" height="13" rx="2" fill="#7dd3fc"/><text x="83" y="178" font-size="9.5" fill="#0369a1">3,8 %</text>
<text x="34" y="198" font-size="10.5" fill="#44403c" text-anchor="end">Nova Sea</text>
<rect x="40" y="188" width="29" height="13" rx="2" fill="#7dd3fc"/><text x="74" y="198" font-size="9.5" fill="#0369a1">2,9 %</text>
<text x="40" y="224" font-size="10.5" font-weight="600" fill="#0f172a">CR4 57,0 %  ·  CR3 47,5 %  ·  HHI ~929</text>

<!-- Right panel: dilution comparison -->
<text x="330" y="74" font-size="11.5" font-weight="600" fill="#0f172a">HHI faller når land-/offshore tas med</text>
<!-- two vertical bars; baseline y=250, scale 160px / 1000 -->
<line x1="330" y1="250" x2="560" y2="250" stroke="#e7e5e4" stroke-width="1"/>
<!-- sjøbasert 929 -->
<rect x="360" y="101" width="54" height="149" rx="2" fill="#075985"/><text x="387" y="95" font-size="10" fill="#075985" text-anchor="middle">~929</text>
<text x="387" y="266" font-size="9.5" fill="#44403c" text-anchor="middle">sjøbasert</text><text x="387" y="278" font-size="9" fill="#78716c" text-anchor="middle">n=92</text>
<!-- total 510 -->
<rect x="470" y="168" width="54" height="82" rx="2" fill="#bae6fd"/><text x="497" y="162" font-size="10" fill="#0369a1" text-anchor="middle">~510</text>
<text x="497" y="266" font-size="9.5" fill="#44403c" text-anchor="middle">all matfisk-MTB</text><text x="497" y="278" font-size="9" fill="#78716c" text-anchor="middle">n=140 (inkl. land-RAS)</text>
<text x="330" y="304" font-size="10" fill="#44403c">Store land-RAS/offshore-tillatelser har høy nominell MTB,</text>
<text x="330" y="318" font-size="10" fill="#44403c">ofte 1 lokalitet, ennå ikke i drift → fortynner totaltallet.</text>

<text x="290" y="348" font-size="9" fill="#a8a29e" text-anchor="middle">Restråstoff skalerer med biomasse → sjøbasert MTB-HHI er rett mål. Restråstoffvolum per aktør = needs-data (RUBIN/SINTEF). Intern baseline.</text>
</svg>
