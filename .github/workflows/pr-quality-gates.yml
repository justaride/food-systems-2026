name: PR Quality Gates

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Ensure main ref exists
        run: git fetch origin main --depth=1

      - name: Block raw research artifacts
        run: npm run audit:research-artifacts -- --base=origin/main

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint
