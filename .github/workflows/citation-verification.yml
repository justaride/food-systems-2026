name: Citation Verification

# Periodic integrity checks for cited sources on prod DB.
# Uses Cloudflare Tunnel TCP forwarding to reach prod postgres without
# exposing the DB on the public internet.
#
# Required setup: see docs/SETUP-CF-TUNNEL-FOR-DB.md
#
# Required secrets:
#   DATABASE_URL              — prod connection (uses localhost:5432 — tunnel proxies)
#   CF_ACCESS_CLIENT_ID       — CF Access service token client ID
#   CF_ACCESS_CLIENT_SECRET   — CF Access service token client secret
#
# Required variable:
#   CITATION_VERIFY_ENABLED   — set to "true" to enable runs
#
# Until CITATION_VERIFY_ENABLED is set, jobs are skipped (safe by default).

on:
  schedule:
    - cron: '0 3 * * 0'    # Sundays 03:00 UTC
  workflow_dispatch:

jobs:
  filehash-drift:
    name: Verify SourceCitation fileHash integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.CITATION_VERIFY_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TUNNEL_HOSTNAME: fs-db.naturalstateproject.com
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start TCP tunnel to prod DB
        run: |
          # cloudflared access tcp reads the service token from --service-token-id/
          # --secret, NOT CF_ACCESS_CLIENT_ID/SECRET — passing the wrong vars means no
          # token is presented and CF Access rejects with "websocket: bad handshake".
          nohup cloudflared access tcp \
            --hostname "$TUNNEL_HOSTNAME" \
            --url localhost:5432 \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          # Wait for an authenticated Postgres connection through the tunnel, not just
          # an open local socket: `nc -z` is a false positive on the cloudflared listener
          # when the CF Access handshake to origin fails (tunnel.log shows
          # "websocket: bad handshake"). psql probes the real end-to-end path.
          ok=0
          for i in $(seq 1 30); do
            if psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1; then
              echo "Authenticated DB connection ready (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::DB not reachable through CF Access tunnel"; cat tunnel.log; exit 1; fi

      - name: Verify fileHash
        run: npm run db:verify:filehash

      - name: Stop tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then kill "$(cat tunnel.pid)" 2>/dev/null || true; fi

  url-health:
    name: HTTP-verify needs_review SourceCitations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.CITATION_VERIFY_ENABLED == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TUNNEL_HOSTNAME: fs-db.naturalstateproject.com
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start TCP tunnel to prod DB
        run: |
          # cloudflared access tcp reads the service token from --service-token-id/
          # --secret, NOT CF_ACCESS_CLIENT_ID/SECRET — passing the wrong vars means no
          # token is presented and CF Access rejects with "websocket: bad handshake".
          nohup cloudflared access tcp \
            --hostname "$TUNNEL_HOSTNAME" \
            --url localhost:5432 \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          # Authenticated probe (see filehash job for rationale): `nc -z` false-positives
          # on the cloudflared listener when the CF Access handshake to origin fails.
          ok=0
          for i in $(seq 1 30); do
            if psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1; then
              echo "Authenticated DB connection ready (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::DB not reachable through CF Access tunnel"; cat tunnel.log; exit 1; fi

      - name: Verify URL health (apply mode)
        # --limit caps each run at 300 rows. Backlog drains over multiple weeks.
        run: npx tsx scripts/verify-source-citation-url-health.ts --apply --limit 300

      - name: Stop tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then kill "$(cat tunnel.pid)" 2>/dev/null || true; fi
