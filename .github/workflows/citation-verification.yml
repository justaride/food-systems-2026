name: Citation Verification

# Periodic integrity checks for cited sources on prod DB.
# Uses Cloudflare Tunnel TCP forwarding to reach prod postgres without
# exposing the DB on the public internet.
#
# Required setup: see docs/SETUP-CF-TUNNEL-FOR-DB.md
#
# Required secrets:
#   DATABASE_URL              — prod connection (uses localhost:5432 — tunnel proxies)
#   CF_ACCESS_CLIENT_ID       — CF Access service token client ID
#   CF_ACCESS_CLIENT_SECRET   — CF Access service token client secret
#
# Required variable:
#   CITATION_VERIFY_ENABLED   — set to "true" to enable runs
#
# Until CITATION_VERIFY_ENABLED is set, jobs are skipped (safe by default).

on:
  schedule:
    - cron: '0 3 * * 0'    # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      migration_preflight_only:
        description: Run only the read-only migration baseline and fileHash checks
        required: false
        default: false
        type: boolean
      corpus_health_refresh:
        description: Regenerate the governed corpus-health bundle against the production database
        required: false
        default: false
        type: boolean

jobs:
  filehash-drift:
    name: Verify SourceCitation fileHash integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      ${{ vars.CITATION_VERIFY_ENABLED == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.corpus_health_refresh != true) }}
    env:
      TUNNEL_HOSTNAME: fs-db.naturalstateproject.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify dedicated migration credential is configured in Coolify
        id: migration_credential
        continue-on-error: true
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$response_file" "$curl_config_file"' EXIT
          chmod 600 "$response_file"
          COOLIFY_API_PATH="/api/v1/applications/$COOLIFY_APP_UUID/envs" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL COOLIFY_APP_UUID \
            CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          curl --config "$curl_config_file" -fsS -m 20 > "$response_file"
          python3 - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          rows = payload if isinstance(payload, list) else payload.get('envs', [])
          if not isinstance(rows, list):
              raise SystemExit('Coolify application env API did not return a list')
          candidates = [
              row for row in rows
              if row.get('key') == 'MIGRATION_DATABASE_URL'
              and row.get('is_preview') is not True
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  'Expected exactly one non-preview MIGRATION_DATABASE_URL in Coolify; '
                  f'found {len(candidates)}'
              )
          candidate = candidates[0]
          if candidate.get('is_runtime') is False:
              raise SystemExit('MIGRATION_DATABASE_URL is explicitly disabled at runtime')
          print('Coolify migration credential key PASS: one non-preview runtime entry')
          PY

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  /usr/local/bin/cloudflared" | sha256sum -c -
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Prepare private libpq connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          connection_dir="$(mktemp -d "${RUNNER_TEMP}/citation-db.XXXXXX")"
          chmod 700 "$connection_dir"

          cleanup_on_error() {
            rm -f -- "$connection_dir/pgpass"
            rmdir -- "$connection_dir" 2>/dev/null || true
          }
          trap cleanup_on_error ERR

          RAW_DATABASE_URL="$DATABASE_URL" \
            DATABASE_CONNECTION_DIR="$connection_dir" \
            GITHUB_ENV_FILE="$GITHUB_ENV" \
            node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const url = new URL(process.env.RAW_DATABASE_URL)
          if (!/^postgres(ql)?:$/.test(url.protocol)) {
            throw new Error('DATABASE_URL must use PostgreSQL')
          }

          const decode = (value) => decodeURIComponent(value)
          const host = url.hostname
          const port = url.port || '5432'
          const database = decode(url.pathname.replace(/^\/+/, ''))
          const user = decode(url.username)
          const password = decode(url.password)
          const sourceSslmode = url.searchParams.get('sslmode') || 'prefer'
          const values = { host, port, database, user, password, sourceSslmode }

          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n\0]/.test(value)) {
              throw new Error(`DATABASE_URL has an invalid ${name}`)
            }
          }

          const escapePgpass = (value) => value.replace(/\\/g, '\\\\').replace(/:/g, '\\:')
          const pgpass = [host, port, database, user, password].map(escapePgpass).join(':') + '\n'
          const pgpassFile = path.join(process.env.DATABASE_CONNECTION_DIR, 'pgpass')
          fs.writeFileSync(pgpassFile, pgpass, { mode: 0o600 })

          // The Cloudflare Access TCP tunnel is the encrypted transport. Its
          // local listener forwards plain PostgreSQL, so node-postgres must not
          // attempt a second TLS handshake. Keep the password in pgpass and
          // export only a credential-free URL for Prisma's pg adapter.
          const localUrl = new URL('postgresql://localhost')
          localUrl.username = user
          localUrl.hostname = host
          localUrl.port = port
          localUrl.pathname = `/${database}`
          localUrl.searchParams.set('sslmode', 'disable')

          const env = [
            ['DATABASE_CONNECTION_DIR', process.env.DATABASE_CONNECTION_DIR],
            ['PGHOST', host],
            ['PGPORT', port],
            ['PGDATABASE', database],
            ['PGUSER', user],
            ['PGSSLMODE', 'disable'],
            ['PGPASSFILE', pgpassFile],
            ['DATABASE_URL', localUrl.toString()],
          ]
          fs.appendFileSync(
            process.env.GITHUB_ENV_FILE,
            env.map(([name, value]) => `${name}=${value}`).join('\n') + '\n',
          )
          NODE

          trap - ERR

      - name: Start TCP tunnel to prod DB
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          unset PGPASSWORD
          # cloudflared 2026.7.2 maps these inherited env variables to its
          # service-token flags. Keep the secret out of the process argument list.
          nohup cloudflared access tcp \
            --hostname "$TUNNEL_HOSTNAME" \
            --url localhost:5432 \
            > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          # Wait for an authenticated Postgres connection through the tunnel, not just
          # an open local socket: `nc -z` is a false positive on the cloudflared listener
          # when the CF Access handshake to origin fails (tunnel.log shows
          # "websocket: bad handshake"). psql probes the real end-to-end path.
          ok=0
          for i in $(seq 1 30); do
            if psql -X -tAc 'select 1' >/dev/null 2>&1; then
              echo "Authenticated DB connection ready (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::DB not reachable through CF Access tunnel"; cat tunnel.log; exit 1; fi

      - name: Verify production migration baseline
        id: migration_baseline
        continue-on-error: true
        run: scripts/verify-production-migration-baseline.sh

      - name: Audit production schema drift
        id: schema_drift
        if: ${{ always() }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/verify-database-schema-drift.sh

      - name: Verify fileHash
        if: ${{ always() }}
        run: npm run db:verify:filehash

      - name: Stop tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then kill "$(cat tunnel.pid)" 2>/dev/null || true; fi
          case "${DATABASE_CONNECTION_DIR:-}" in
            "$RUNNER_TEMP"/citation-db.*)
              rm -f -- "$DATABASE_CONNECTION_DIR/pgpass"
              rmdir -- "$DATABASE_CONNECTION_DIR" 2>/dev/null || true
              ;;
            '') ;;
            *) echo "::warning::Refusing to remove unexpected connection directory" ;;
          esac

      - name: Enforce dedicated migration credential gate
        if: >-
          ${{ always() && (
              steps.migration_credential.outcome != 'success' ||
              steps.migration_baseline.outcome != 'success' ||
              steps.schema_drift.outcome != 'success'
          ) }}
        run: |
          echo '::error::Production migration readiness is not complete; inspect the independent credential, ledger, and schema-drift steps.'
          exit 1

  corpus-health-refresh:
    name: Regenerate governed corpus health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      ${{ vars.CITATION_VERIFY_ENABLED == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.corpus_health_refresh == true }}
    env:
      TUNNEL_HOSTNAME: fs-db.naturalstateproject.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  /usr/local/bin/cloudflared" | sha256sum -c -
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Prepare private corpus-health connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          connection_dir="$(mktemp -d "${RUNNER_TEMP}/citation-db.XXXXXX")"
          chmod 700 "$connection_dir"

          cleanup_on_error() {
            rm -f -- "$connection_dir/pgpass"
            rmdir -- "$connection_dir" 2>/dev/null || true
          }
          trap cleanup_on_error ERR

          RAW_DATABASE_URL="$DATABASE_URL" \
            DATABASE_CONNECTION_DIR="$connection_dir" \
            GITHUB_ENV_FILE="$GITHUB_ENV" \
            node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const url = new URL(process.env.RAW_DATABASE_URL)
          if (!/^postgres(ql)?:$/.test(url.protocol)) {
            throw new Error('DATABASE_URL must use PostgreSQL')
          }

          const decode = (value) => decodeURIComponent(value)
          const host = url.hostname
          const port = url.port || '5432'
          const database = decode(url.pathname.replace(/^\/+/, ''))
          const user = decode(url.username)
          const password = decode(url.password)
          const sourceSslmode = url.searchParams.get('sslmode') || 'prefer'
          const values = { host, port, database, user, password, sourceSslmode }

          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n\0]/.test(value)) {
              throw new Error(`DATABASE_URL has an invalid ${name}`)
            }
          }

          const escapePgpass = (value) => value.replace(/\\/g, '\\\\').replace(/:/g, '\\:')
          const pgpass = [host, port, database, user, password].map(escapePgpass).join(':') + '\n'
          const pgpassFile = path.join(process.env.DATABASE_CONNECTION_DIR, 'pgpass')
          fs.writeFileSync(pgpassFile, pgpass, { mode: 0o600 })

          const localUrl = new URL('postgresql://localhost')
          localUrl.username = user
          localUrl.hostname = host
          localUrl.port = port
          localUrl.pathname = `/${database}`
          localUrl.searchParams.set('sslmode', 'disable')

          const env = [
            ['DATABASE_CONNECTION_DIR', process.env.DATABASE_CONNECTION_DIR],
            ['PGHOST', host],
            ['PGPORT', port],
            ['PGDATABASE', database],
            ['PGUSER', user],
            ['PGSSLMODE', 'disable'],
            ['PGPASSFILE', pgpassFile],
            ['DATABASE_URL', localUrl.toString()],
          ]
          fs.appendFileSync(
            process.env.GITHUB_ENV_FILE,
            env.map(([name, value]) => `${name}=${value}`).join('\n') + '\n',
          )
          NODE

          trap - ERR

      - name: Start TCP tunnel to prod DB
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          unset PGPASSWORD
          nohup cloudflared access tcp \
            --hostname "$TUNNEL_HOSTNAME" \
            --url localhost:5432 \
            > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          ok=0
          for i in $(seq 1 30); do
            if psql -X -tAc 'select 1' >/dev/null 2>&1; then
              echo "Authenticated DB connection ready (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::DB not reachable through CF Access tunnel"; cat tunnel.log; exit 1; fi

      - name: Regenerate and verify corpus-health bundle
        run: |
          set -euo pipefail
          supersedes_id=$(node -e 'process.stdout.write(require("./knowledge/health/corpus-health-current.v1.json").assessmentId)')
          CORPUS_HEALTH_SUPERSEDES_ID="$supersedes_id" npm run knowledge:health:generate
          npm run knowledge:health:check
          git diff --check
          unexpected=$(git diff --name-only | grep -Ev '^knowledge/health/corpus-health-(source-snapshots|source-snapshot-history|assessments|current|summary|report|generation-manifest)\.v1\.(json|jsonl|md)$' || true)
          if [ -n "$unexpected" ]; then
            echo '::error::Corpus-health generation changed files outside the governed bundle'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Stop tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then kill "$(cat tunnel.pid)" 2>/dev/null || true; fi
          case "${DATABASE_CONNECTION_DIR:-}" in
            "$RUNNER_TEMP"/citation-db.*)
              rm -f -- "$DATABASE_CONNECTION_DIR/pgpass"
              rmdir -- "$DATABASE_CONNECTION_DIR" 2>/dev/null || true
              ;;
            '') ;;
            *) echo "::warning::Refusing to remove unexpected connection directory" ;;
          esac

      - name: Upload governed corpus-health bundle
        uses: actions/upload-artifact@v4
        with:
          name: corpus-health-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            knowledge/health/corpus-health-source-snapshots.v1.json
            knowledge/health/corpus-health-source-snapshot-history.v1.jsonl
            knowledge/health/corpus-health-assessments.v1.jsonl
            knowledge/health/corpus-health-current.v1.json
            knowledge/health/corpus-health-summary.v1.json
            knowledge/health/corpus-health-report.v1.md
            knowledge/health/corpus-health-generation-manifest.v1.json

  url-health:
    name: HTTP-verify needs_review SourceCitations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      ${{ vars.CITATION_VERIFY_ENABLED == 'true' &&
          (github.event_name != 'workflow_dispatch' || (
            inputs.migration_preflight_only != true &&
            inputs.corpus_health_refresh != true
          )) }}
    env:
      TUNNEL_HOSTNAME: fs-db.naturalstateproject.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  /usr/local/bin/cloudflared" | sha256sum -c -
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Prepare private libpq connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          connection_dir="$(mktemp -d "${RUNNER_TEMP}/citation-db.XXXXXX")"
          chmod 700 "$connection_dir"

          cleanup_on_error() {
            rm -f -- "$connection_dir/pgpass"
            rmdir -- "$connection_dir" 2>/dev/null || true
          }
          trap cleanup_on_error ERR

          RAW_DATABASE_URL="$DATABASE_URL" \
            DATABASE_CONNECTION_DIR="$connection_dir" \
            GITHUB_ENV_FILE="$GITHUB_ENV" \
            node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const url = new URL(process.env.RAW_DATABASE_URL)
          if (!/^postgres(ql)?:$/.test(url.protocol)) {
            throw new Error('DATABASE_URL must use PostgreSQL')
          }

          const decode = (value) => decodeURIComponent(value)
          const host = url.hostname
          const port = url.port || '5432'
          const database = decode(url.pathname.replace(/^\/+/, ''))
          const user = decode(url.username)
          const password = decode(url.password)
          const sourceSslmode = url.searchParams.get('sslmode') || 'prefer'
          const values = { host, port, database, user, password, sourceSslmode }

          for (const [name, value] of Object.entries(values)) {
            if (!value || /[\r\n\0]/.test(value)) {
              throw new Error(`DATABASE_URL has an invalid ${name}`)
            }
          }

          const escapePgpass = (value) => value.replace(/\\/g, '\\\\').replace(/:/g, '\\:')
          const pgpass = [host, port, database, user, password].map(escapePgpass).join(':') + '\n'
          const pgpassFile = path.join(process.env.DATABASE_CONNECTION_DIR, 'pgpass')
          fs.writeFileSync(pgpassFile, pgpass, { mode: 0o600 })

          // The Cloudflare Access TCP tunnel is the encrypted transport. Its
          // local listener forwards plain PostgreSQL, so node-postgres must not
          // attempt a second TLS handshake. Keep the password in pgpass and
          // export only a credential-free URL for Prisma's pg adapter.
          const localUrl = new URL('postgresql://localhost')
          localUrl.username = user
          localUrl.hostname = host
          localUrl.port = port
          localUrl.pathname = `/${database}`
          localUrl.searchParams.set('sslmode', 'disable')

          const env = [
            ['DATABASE_CONNECTION_DIR', process.env.DATABASE_CONNECTION_DIR],
            ['PGHOST', host],
            ['PGPORT', port],
            ['PGDATABASE', database],
            ['PGUSER', user],
            ['PGSSLMODE', 'disable'],
            ['PGPASSFILE', pgpassFile],
            ['DATABASE_URL', localUrl.toString()],
          ]
          fs.appendFileSync(
            process.env.GITHUB_ENV_FILE,
            env.map(([name, value]) => `${name}=${value}`).join('\n') + '\n',
          )
          NODE

          trap - ERR

      - name: Start TCP tunnel to prod DB
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          unset PGPASSWORD
          # cloudflared 2026.7.2 maps these inherited env variables to its
          # service-token flags. Keep the secret out of the process argument list.
          nohup cloudflared access tcp \
            --hostname "$TUNNEL_HOSTNAME" \
            --url localhost:5432 \
            > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          # Authenticated probe (see filehash job for rationale): `nc -z` false-positives
          # on the cloudflared listener when the CF Access handshake to origin fails.
          ok=0
          for i in $(seq 1 30); do
            if psql -X -tAc 'select 1' >/dev/null 2>&1; then
              echo "Authenticated DB connection ready (attempt $i)"; ok=1; break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "::error::DB not reachable through CF Access tunnel"; cat tunnel.log; exit 1; fi

      - name: Verify URL health (apply mode)
        # --limit caps each run at 300 rows. Backlog drains over multiple weeks.
        run: npx tsx scripts/verify-source-citation-url-health.ts --apply --limit 300

      - name: Stop tunnel
        if: always()
        run: |
          if [ -f tunnel.pid ]; then kill "$(cat tunnel.pid)" 2>/dev/null || true; fi
          case "${DATABASE_CONNECTION_DIR:-}" in
            "$RUNNER_TEMP"/citation-db.*)
              rm -f -- "$DATABASE_CONNECTION_DIR/pgpass"
              rmdir -- "$DATABASE_CONNECTION_DIR" 2>/dev/null || true
              ;;
            '') ;;
            *) echo "::warning::Refusing to remove unexpected connection directory" ;;
          esac
