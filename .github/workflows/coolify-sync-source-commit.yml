name: Coolify Deploy Verify

# Manual, read-only proof for a deployment that Coolify has already built from
# its Git integration. This workflow never changes application environment
# variables and never triggers a deploy.
#
# Required production-environment secrets:
#   COOLIFY_READ_API_TOKEN
#   COOLIFY_BASE_URL
#   COOLIFY_APP_UUID
#   CF_ACCESS_CLIENT_ID
#   CF_ACCESS_CLIENT_SECRET

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY to run read-only deployment verification'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: coolify-deploy-verify
  cancel-in-progress: false

env:
  APP_DOMAIN: food-systems.naturalstateproject.com

jobs:
  verify-deployment:
    if: ${{ inputs.confirm == 'VERIFY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout hardened API helper
        uses: actions/checkout@v6

      - name: Verify latest Coolify deployment is finished
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_READ_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deployment_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$deployment_file" "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/deployments/applications/$UUID" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL UUID
          curl --config "$curl_config_file" -fsS -m 15 > "$deployment_file"
          python3 - "$deployment_file" "$EXPECTED_SHA" <<'PY'
          import json
          import re
          import sys

          path, expected_sha = sys.argv[1:]
          if not re.fullmatch(r'[0-9a-f]{40}', expected_sha):
              raise SystemExit('github.sha is not a full 40-character commit SHA')
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          deployments = payload if isinstance(payload, list) else payload.get('deployments', [])
          if not deployments:
              raise SystemExit('Coolify returned no deployments')
          latest = deployments[0]
          if latest.get('status') != 'finished':
              raise SystemExit(f"Latest Coolify deployment is not finished: {latest.get('status')}")
          deployed_sha = (
              latest.get('commit')
              or latest.get('commit_sha')
              or latest.get('git_commit_sha')
          )
          if deployed_sha and deployed_sha != expected_sha:
              raise SystemExit(f'Latest Coolify deployment SHA differs from selected ref: {deployed_sha}')
          print('Coolify deployment record is finished')
          PY
      - name: Verify exact runtime SHA and application health
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          version_file=$(mktemp)
          data_file=$(mktemp)
          library_file=$(mktemp)
          access_header_file=$(mktemp)
          trap 'rm -f "$version_file" "$data_file" "$library_file" "$access_header_file"' EXIT
          case "$CF_ID" in
            ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client ID'; exit 1 ;;
          esac
          case "$CF_SECRET" in
            ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client secret'; exit 1 ;;
          esac
          (umask 077; {
            printf 'CF-Access-Client-Id: %s\n' "$CF_ID"
            printf 'CF-Access-Client-Secret: %s\n' "$CF_SECRET"
          } > "$access_header_file")
          chmod 600 "$access_header_file"
          unset CF_ID CF_SECRET

          for endpoint in version data-status library-analysis/status; do
            case "$endpoint" in
              version) output=$version_file ;;
              data-status) output=$data_file ;;
              library-analysis/status) output=$library_file ;;
            esac
            curl -fsS -m 20 --header "@$access_header_file" \
              "https://$APP_DOMAIN/api/$endpoint?deploy_check=$EXPECTED_SHA" > "$output"
          done

          python3 - "$version_file" "$data_file" "$library_file" "$EXPECTED_SHA" <<'PY'
          import json
          import sys

          version_path, data_path, library_path, expected_sha = sys.argv[1:]
          with open(version_path, encoding='utf-8') as handle:
              version = json.load(handle)
          with open(data_path, encoding='utf-8') as handle:
              data = json.load(handle)
          with open(library_path, encoding='utf-8') as handle:
              library = json.load(handle)

          actual_sha = version.get('sha')
          if actual_sha != expected_sha:
              raise SystemExit(f'/api/version SHA mismatch: {actual_sha} != {expected_sha}')
          required_data_flags = ('ok', 'dbOk', 'pageGatesOk', 'knowledgeBaseGatesOk')
          failed = [flag for flag in required_data_flags if data.get(flag) is not True]
          if failed:
              raise SystemExit(f'/api/data-status failed gates: {", ".join(failed)}')
          if library.get('ok') is not True:
              raise SystemExit('/api/library-analysis/status is not operationally healthy')
          print(f'Runtime proof PASS: {actual_sha}')
          PY
