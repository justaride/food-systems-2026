name: Coolify SHA Sync

# Synker Coolify SOURCE_COMMIT med main HEAD, utløser redeploy og beviser at
# runtime faktisk kjører samme SHA. Coolify-installasjonen eksponerer foreløpig
# ikke automatisk commit-SHA til Docker-bygget, så den eksplisitte synken er en
# nødvendig og overvåket del av releasekjeden.
#
# Repository secrets:
#   COOLIFY_API_TOKEN
#   COOLIFY_BASE_URL      — https://coolify.gabistudio.dev
#   COOLIFY_APP_UUID      — so8ko44goccc8gcgswwscgco
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-sha-sync-main
  cancel-in-progress: true

env:
  APP_DOMAIN: food-systems.naturalstateproject.com

jobs:
  sync-and-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout hardened API helper
        uses: actions/checkout@v6

      - name: Validate release SHA
        env:
          SHA: ${{ github.sha }}
        run: |
          case "$SHA" in
            *[!0-9a-f]*|'') echo '::error::github.sha is not a lowercase hexadecimal SHA'; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo '::error::github.sha must contain 40 characters'; exit 1; }

      - name: Find existing SOURCE_COMMIT envs
        id: envs
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$response_file" "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/applications/$UUID/envs" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          curl --config "$curl_config_file" -fsS -m 20 > "$response_file"
          uuids=$(python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              response = json.load(handle)
          envs = response if isinstance(response, list) else response.get('envs', [])
          print(' '.join(item['uuid'] for item in envs if item.get('key') == 'SOURCE_COMMIT'))
          PY
          )
          echo "uuids=$uuids" >> "$GITHUB_OUTPUT"
          echo "Existing SOURCE_COMMIT entries: ${uuids:-none}"

      - name: Update SOURCE_COMMIT envs
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          SHA: ${{ github.sha }}
          ENV_UUIDS: ${{ steps.envs.outputs.uuids }}
        run: |
          set -euo pipefail
          curl_config_file=$(mktemp)
          trap 'rm -f "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/applications/$UUID/envs" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          if [ -z "$ENV_UUIDS" ]; then
            echo 'Creating SOURCE_COMMIT'
            curl --config "$curl_config_file" -fsS -X POST \
              -H 'Content-Type: application/json' \
              --data "{\"key\":\"SOURCE_COMMIT\",\"value\":\"$SHA\"}"
          else
            for env_uuid in $ENV_UUIDS; do
              echo "Updating SOURCE_COMMIT entry $env_uuid"
              curl --config "$curl_config_file" -fsS -X PATCH \
                -H 'Content-Type: application/json' \
                --data "{\"key\":\"SOURCE_COMMIT\",\"value\":\"$SHA\"}"
            done
          fi

      - name: Trigger redeploy
        id: deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$response_file" "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/deploy?uuid=$UUID&force=true" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          curl --config "$curl_config_file" -fsS -X POST > "$response_file"
          deployment_uuid=$(python3 - "$response_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          candidates = [data.get('deployment_uuid'), data.get('uuid'), data.get('id')]
          deployments = data.get('deployments')
          if isinstance(deployments, list) and deployments:
              first = deployments[0]
              candidates.extend([first.get('deployment_uuid'), first.get('uuid'), first.get('id')])
          print(next((value for value in candidates if value), 'unknown'))
          PY
          )
          [ "$deployment_uuid" != unknown ] || { echo '::error::Coolify returned no deployment UUID'; exit 1; }
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "Deployment queued: $deployment_uuid"

      - name: Wait for deployment to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$response_file" "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/deployments/applications/$UUID" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          deploy_finished=0
          for attempt in $(seq 1 90); do
            sleep 10
            curl --config "$curl_config_file" -fsS -m 20 > "$response_file"
            status=$(python3 - "$response_file" "$DEPLOYMENT_UUID" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          deployments = data.get('deployments', [])
          wanted = sys.argv[2]
          selected = next((item for item in deployments if wanted in (item.get('deployment_uuid'), item.get('uuid'), item.get('id'))), None)
          print((selected or {}).get('status', 'unknown'))
          PY
          )
            echo "[$attempt/90] deploy status: $status"
            case "$status" in
              finished) deploy_finished=1; break ;;
              failed|cancelled) echo "::error::Deploy $status"; exit 1 ;;
            esac
          done
          [ "$deploy_finished" = 1 ] || { echo "::error::Deploy timeout; last status: $status"; exit 1; }

      - name: Verify exact runtime SHA and application health
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          version_file=$(mktemp)
          data_file=$(mktemp)
          library_file=$(mktemp)
          access_header_file=$(mktemp)
          trap 'rm -f "$version_file" "$data_file" "$library_file" "$access_header_file"' EXIT
          case "$CF_ID" in ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client ID'; exit 1 ;; esac
          case "$CF_SECRET" in ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client secret'; exit 1 ;; esac
          (umask 077; {
            printf 'CF-Access-Client-Id: %s\n' "$CF_ID"
            printf 'CF-Access-Client-Secret: %s\n' "$CF_SECRET"
          } > "$access_header_file")
          chmod 600 "$access_header_file"
          unset CF_ID CF_SECRET

          for endpoint in version data-status library-analysis/status; do
            case "$endpoint" in
              version) output=$version_file ;;
              data-status) output=$data_file ;;
              library-analysis/status) output=$library_file ;;
            esac
            curl -fsS -m 20 --header "@$access_header_file" \
              "https://$APP_DOMAIN/api/$endpoint?deploy_check=$EXPECTED_SHA" > "$output"
          done

          python3 - "$version_file" "$data_file" "$library_file" "$EXPECTED_SHA" <<'PY'
          import json, sys
          version_path, data_path, library_path, expected_sha = sys.argv[1:]
          with open(version_path, encoding='utf-8') as handle: version = json.load(handle)
          with open(data_path, encoding='utf-8') as handle: data = json.load(handle)
          with open(library_path, encoding='utf-8') as handle: library = json.load(handle)
          actual_sha = version.get('sha')
          if actual_sha != expected_sha:
              raise SystemExit(f'/api/version SHA mismatch: {actual_sha} != {expected_sha}')
          required = ('ok', 'dbOk', 'pageGatesOk', 'knowledgeBaseGatesOk')
          failed = [flag for flag in required if data.get(flag) is not True]
          if failed:
              raise SystemExit(f'/api/data-status failed gates: {", ".join(failed)}')
          if library.get('operational') is not True:
              raise SystemExit('/api/library-analysis/status is not operationally healthy')
          print(f'Runtime proof PASS: {actual_sha}')
          PY
