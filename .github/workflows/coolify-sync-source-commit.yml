name: Coolify SHA Sync

# Synker Coolify SOURCE_COMMIT env-var med main HEAD etter merge.
# Bakgrunn: Coolify auto-injecter ikke COOLIFY_GIT_COMMIT_SHA som
# build-arg, så write-version.ts er avhengig av manuelt-satt
# SOURCE_COMMIT. Denne workflow oppdaterer det automatisk så
# /api/version reflekterer faktisk deployed SHA.
#
# Repository secrets som kreves:
#   COOLIFY_API_TOKEN — API-token fra Coolify
#   COOLIFY_BASE_URL  — http://77.42.43.227:8000
#   COOLIFY_APP_UUID  — so8ko44goccc8gcgswwscgco
#
# Workflow triggers redeploy så ny SHA skrives av write-version.ts
# under bygging.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: coolify-sha-sync-main
  cancel-in-progress: true

jobs:
  sync-and-redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get current commit SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Find existing SOURCE_COMMIT envs
        id: envs
        env:
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          response=$(curl -sS -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$UUID/envs")
          uuids=$(echo "$response" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          envs = d if isinstance(d, list) else d.get('envs', [])
          uuids = [e['uuid'] for e in envs if e.get('key') == 'SOURCE_COMMIT']
          print(' '.join(uuids))
          ")
          echo "uuids=$uuids" >> "$GITHUB_OUTPUT"
          echo "Existing SOURCE_COMMIT uuids: $uuids"

      - name: Update SOURCE_COMMIT envs
        env:
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          SHA: ${{ steps.sha.outputs.sha }}
          ENV_UUIDS: ${{ steps.envs.outputs.uuids }}
        run: |
          if [ -z "$ENV_UUIDS" ]; then
            echo "No SOURCE_COMMIT env found — creating new"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "$BASE/api/v1/applications/$UUID/envs" \
              -d "{\"key\":\"SOURCE_COMMIT\",\"value\":\"$SHA\"}"
            echo ""
          else
            for env_uuid in $ENV_UUIDS; do
              echo "Updating env $env_uuid → $SHA"
              # PATCH endpoint to update existing
              curl -sS -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                "$BASE/api/v1/applications/$UUID/envs" \
                -d "{\"key\":\"SOURCE_COMMIT\",\"value\":\"$SHA\"}"
              echo ""
            done
          fi

      - name: Trigger redeploy
        id: deploy
        env:
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          response=$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/deploy?uuid=$UUID&force=true")
          echo "$response"
          deployment_uuid=$(echo "$response" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              candidates = [
                  d.get('deployment_uuid'),
                  d.get('uuid'),
                  d.get('id'),
              ]
              deployments = d.get('deployments')
              if isinstance(deployments, list) and deployments:
                  first = deployments[0]
                  candidates.extend([
                      first.get('deployment_uuid'),
                      first.get('uuid'),
                      first.get('id'),
                  ])
              print(next((c for c in candidates if c), 'unknown'))
          except Exception:
              print('unknown')
          ")
          echo "Deployment queued: $deployment_uuid"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy + verify /api/version
        env:
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          SHA: ${{ steps.sha.outputs.sha }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # Vent på at deploy fullføres (maks 12 min). Hvis Coolify blir stående
          # i queued/building skal workflow feile, ikke rapportere grønt med
          # stale /api/version.
          deploy_finished=0
          for i in $(seq 1 72); do
            sleep 10
            status=$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "$BASE/api/v1/deployments/applications/$UUID" \
              | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          deployments = d.get('deployments', [])
          wanted = '$DEPLOYMENT_UUID'
          if wanted and wanted != 'unknown':
              for item in deployments:
                  if wanted in (item.get('deployment_uuid'), item.get('uuid'), item.get('id')):
                      print(item.get('status', '?'))
                      break
              else:
                  print(deployments[0].get('status','?') if deployments else '?')
          else:
              print(deployments[0].get('status','?') if deployments else '?')
          ")
            echo "[${i}/72] deploy status: $status"
            case "$status" in
              finished) deploy_finished=1; break;;
              failed|cancelled)
                echo "::error::Deploy $status"
                exit 1
                ;;
            esac
          done
          if [ "$deploy_finished" != "1" ]; then
            echo "::error::Deploy did not finish before timeout. Last status: $status"
            exit 1
          fi

          # Verifiser /api/version
          if [ -z "$CF_ID" ] || [ -z "$CF_SECRET" ]; then
            echo "::error::CF Access service token secrets are required for deploy proof"
            exit 1
          fi

          version=$(curl -sS \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET" \
            "https://food-systems.naturalstateproject.com/api/version?deploy_check=$SHA")
          echo "Deployed version: $version"
          actual_sha=$(echo "$version" | python3 -c "
          import sys, json
          try:
              print(json.load(sys.stdin).get('sha', ''))
          except Exception:
              print('')
          ")
          if [ "$actual_sha" != "$SHA" ]; then
            echo "::error::/api/version ($actual_sha) matcher ikke SHA $SHA"
            exit 1
          fi
          echo "::notice::/api/version matcher push-SHA"
