name: Schema migration guard

# Fails a push/PR when prisma/schema.prisma changes but no new migration file
# is added. Production schema is synced only by prisma/migrations/* (applied by
# scripts/apply-prod-migrations.sh on deploy) — a schema change with no
# migration silently drifts prod, which is exactly how the 38-column /
# SourceCitation / BoardMember drift happened.
#
# This workflow also validates the Prisma schema, freezes released migration
# checksums, syntax-checks the operational POSIX shell scripts, and exercises
# the database/MCP safety contracts without connecting to a database.
#
# Escape hatch: put [skip-migration] in a commit message for schema edits that
# genuinely need no migration (comments, formatting, generator/datasource block).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a migration when schema.prisma changes
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "New branch / no prior commit — guard skipped."
              exit 0
            fi
            RANGE="$BEFORE..${{ github.sha }}"
          fi
          echo "Comparing range: $RANGE"

          if git log --format=%B "$RANGE" | grep -qi '\[skip-migration\]'; then
            echo "Found [skip-migration] in a commit message — guard skipped."
            exit 0
          fi

          if ! git diff --name-only "$RANGE" | grep -qx 'prisma/schema.prisma'; then
            echo "prisma/schema.prisma unchanged — OK."
            exit 0
          fi

          if git diff --name-only --diff-filter=A "$RANGE" | grep -q '^prisma/migrations/.*/migration\.sql$'; then
            echo "schema.prisma changed and a new migration file was added — OK."
            exit 0
          fi

          echo "::error::prisma/schema.prisma changed but no new prisma/migrations/*/migration.sql was added."
          echo "Add an idempotent migration (see existing files under prisma/migrations/),"
          echo "or put [skip-migration] in a commit message if this change needs no migration."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@db.invalid:5432/foodsystems_ci?schema=public
        run: ./node_modules/.bin/prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@db.invalid:5432/foodsystems_ci?schema=public
        run: ./node_modules/.bin/prisma generate --schema prisma/schema.prisma

      - name: Validate database operations shell syntax
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            scripts/apply-prod-migrations.sh
            scripts/bootstrap-mcp-readonly-role.sh
            scripts/verify-mcp-readonly-role.sh
            scripts/create-database-backup.sh
            scripts/verify-database-backup.sh
            scripts/restore-database-backup-drill.sh
            scripts/verify-database-schema-drift.sh
            scripts/verify-production-migration-baseline.sh
          )

          for script in "${scripts[@]}"; do
            test -f "$script"
            test -x "$script"
            test "$(head -n 1 "$script")" = '#!/bin/sh'
            sh -n "$script"
          done

      - name: Run database operations and workflow contracts
        run: >-
          node --import=tsx --test
          tests/lib/db-ops-hardening.test.ts
          tests/lib/coolify-db-watcher-workflow.test.ts
          tests/lib/docker-runtime-migration.test.ts
          tests/lib/food-tg-board-schema.test.ts
          tests/lib/schema-migration-guard-workflow.test.ts

      - name: Run MCP protocol and security contracts
        run: npm run mcp:kb:test
