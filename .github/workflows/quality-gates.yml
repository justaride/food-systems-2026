name: Quality Gates

# Het `PR Quality Gates` / `pr-quality-gates.yml` fram til 2026-08-25, da
# `push: [main]` kom til. Den kjører ikke lenger bare på PR-er, og et navn som
# var sant én gang er samme feilklasse som et feil tall.
#
# Fyrer på tre hendelser, og hver av dem dekker et hull de to andre har:
#
#   pull_request  — porten før merge.
#   push: main    — merge-commiten selv. En PR testes grønn mot sin egen
#                   head-SHA, ikke mot resultatet av å merge den. To PR-er som
#                   hver for seg er grønne kan bryte main sammen, og fram til
#                   2026-08-25 fantes det ingen kjøring som ville sagt fra.
#                   Det betyr noe her fordi container-entrypointet anvender
#                   migrasjoner ved oppstart: en brukket main er en deploy.
#   workflow_dispatch — manuelle kjøringer.
#
# Merk at `push` bevisst er avgrenset til main. Tidligere fyrte
# `push: branches-ignore: [main]` — stikk motsatt — og for en gren med åpen PR
# fyrte begge på samme commit: hele workflowen kjørte to ganger, med to jobber
# hver, altså fire sjekk-kjøringer der to holder.
#
# Det var ikke bare sløsing: duplikatene konkurrerte om runnere, og på PR #363
# traff den ene `test-and-audit` taket i `timeout-minutes: 15` og ble rapportert
# som `cancelled` — et rødt merke som så ut som en testfeil, men var en duplikat
# som gikk tom for tid.
#
# En concurrency-guard alene løste ikke dette. Den kappet duplikaten fra ~15 min
# til ~1 min, men kanselleringen skjer fortsatt, så HVER PR fikk to
# `cancelled`-merker og `mergeable_state: unstable` — nettopp det som stoppet
# merge av #363. Duplikaten må ikke starte i det hele tatt.
#
# Main-triggeren gjenskaper ikke duplikaten: en PR-hendelse bærer grenens
# head-SHA, en push til main bærer merge-commitens SHA. Ulike commits, ulikt
# arbeid, ulik concurrency-gruppe.
#
# Kostnad: en gren får ikke CI før PR-en er åpnet (arbeidsflyten er gren → PR,
# så vinduet er kort), og hver merge til main koster ett fullt testbygg pluss
# migrasjonsjobben.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Guarden beholdes selv om dobbelt-triggeren er borte: den hindrer at to
# raske pushes til samme PR, eller to workflow_dispatch-kjøringer, overlapper.
# Nøkkelen er grenens head-SHA — `github.ref` duger ikke, siden PR-hendelsen
# har refs/pull/N/merge og en dispatch har refs/heads/<gren>. For en push til
# main er `github.event.pull_request.head.sha` tom, så fallbacken `github.sha`
# gjelder: merge-commitens egen SHA. Hver merge er en unik gruppe, så to raske
# merger avbryter ikke hverandre — begge merge-resultater blir testet.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Ensure main ref exists
        run: git fetch origin main

      - name: Block raw research artifacts
        run: npm run audit:research-artifacts -- --base=origin/main

      - name: Run tests
        run: npm test

      - name: Audit committed coverage profiles (overclaim gate)
        # Audits committed public/data/coverage/profiles.json + hvitbok asserted
        # scopes against report files — no DB or secrets required.
        # Prod Docker build regenerates profiles fresh (compute-metrics) for
        # the deployed artifact; this gate audits what the PR actually commits.
        run: npm run audit:citable-reports

      - name: Run lint
        run: npm run lint

      # Prod-imaget kopierer utvalgte kataloger og tar aldri med tests/, så
      # `next build` i Docker typesjekker dem ikke. Uten dette steget kan
      # typefeil i tests/ ligge urørt på main og bare vise seg som et brutt
      # `npm run build` lokalt — slik fem av dem gjorde fram til 2026-08-06.
      - name: Type-check everything the Docker build does not see
        run: |
          # src/generated/version.json lages av bygget, ikke av `prisma generate`.
          # Uten den feiler tsc på de tre rutene som importerer den.
          npx tsx scripts/write-version.ts
          npx tsc --noEmit

  # Egen jobb fordi den trenger en Postgres-tjeneste. Vokter kontrakten
  # apply-prod-migrations.sh hviler på: hele migrasjonssettet anvendes på nytt
  # ved hver deploy, så hver migrasjon må tåle gjenbruk. Da kontrakten brast
  # (2026-08-06) døde prod-skjemasynken stille på migrasjon 11 av 14.
  migration-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Every migration must survive re-application
        run: npm run db:verify:migration-idempotency
        env:
          MIGRATION_PROBE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
