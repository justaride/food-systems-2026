name: Coolify Deploy Verify

# Verifiserer deployen Coolify allerede har gjort. Synker ingenting, og
# trigger ingen build.
#
# Het `Coolify SHA Sync` / `coolify-sync-source-commit.yml` fram til
# 2026-08-25, da den fortsatt skrev en eksplisitt SOURCE_COMMIT-miljøvariabel
# til appen og trigget sin egen redeploy. Begge delene er fjernet, og ingen av
# dem må komme tilbake:
#
# 1. Coolify injiserer selv deployens commit i bygget når per-app-innstillingen
#    `Include Source Commit in Build` står PÅ — den står PÅ, og Dockerfile har
#    `ARG SOURCE_COMMIT` / `ENV SOURCE_COMMIT` før `npm run build`. En eksplisitt
#    env-variabel SKYGGET for den injiserte, så /api/version rapporterte det
#    workflowen sist skrev i stedet for det deployen faktisk bygde. En push med
#    GITHUB_TOKEN utløser ingen workflows, så bot-commiter til main fikk aldri
#    ny verdi: 2026-08-25 kjørte prod b41ad9f i ~40 min mens endepunktet sa
#    55ed5d7, med korrekt `builtAt` ved siden av. Målt, ikke antatt — Coolifys
#    deploy-logg viser webhook-deployen av b41ad9f kl. 06:15:48 UTC.
# 2. `Auto Deploy` bygger allerede på webhooken fra GitHub-appen. At denne
#    workflowen i tillegg trigget en API-deploy ga TO fulle bygg per merge, som
#    kjørte samtidig uten rekkefølgegaranti — den som ble ferdig sist vant.
#
# Igjen står det eneste webhooken ikke gjør selv: bevise at runtime faktisk
# kjører den commiten, og at appen er frisk.
#
# Repository secrets:
#   COOLIFY_API_TOKEN
#   COOLIFY_BASE_URL      — https://coolify.gabistudio.dev
#   COOLIFY_APP_UUID      — so8ko44goccc8gcgswwscgco
#   CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-deploy-verify-main
  cancel-in-progress: true

env:
  APP_DOMAIN: food-systems.naturalstateproject.com

jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout hardened API helper
        uses: actions/checkout@v6

      - name: Validate release SHA
        env:
          SHA: ${{ github.sha }}
        run: |
          case "$SHA" in
            *[!0-9a-f]*|'') echo '::error::github.sha is not a lowercase hexadecimal SHA'; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo '::error::github.sha must contain 40 characters'; exit 1; }

      # Venter på Coolifys egen Auto Deploy i stedet for å trigge en til.
      # Tidligere pollet dette steget på en deployment_uuid som trigger-steget
      # returnerte. Uten den triggeren finnes ingen uuid å nøkle på, så her
      # ventes det i stedet på at EN deploy for nettopp denne commiten er
      # ferdig. Flere kan finnes for samme SHA.
      - name: Wait for a finished Coolify deployment of this commit
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          UUID: ${{ secrets.COOLIFY_APP_UUID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          curl_config_file=$(mktemp)
          trap 'rm -f "$response_file" "$curl_config_file"' EXIT
          COOLIFY_API_PATH="/api/v1/deployments/applications/$UUID" \
            scripts/write-private-coolify-curl-config.py "$curl_config_file"
          unset COOLIFY_API_TOKEN COOLIFY_BASE_URL CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET
          deploy_finished=0
          state=pending
          for attempt in $(seq 1 90); do
            sleep 10
            curl --config "$curl_config_file" -fsS -m 20 > "$response_file"
            state=$(python3 - "$response_file" "$EXPECTED_SHA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              data = json.load(handle)
          deployments = data if isinstance(data, list) else data.get('deployments', [])
          wanted = sys.argv[2]

          def commit_of(item):
              return item.get('commit') or item.get('commit_sha') or item.get('git_commit_sha')

          mine = [item for item in deployments if commit_of(item) == wanted]
          statuses = {item.get('status') for item in mine}
          if 'finished' in statuses:
              print('finished')
          elif not mine:
              # Webhooken har kanskje ikke rukket å opprette deployen ennå.
              print('pending')
          elif statuses <= {'failed', 'cancelled'}:
              print('dead')
          else:
              print('running')
          PY
          )
            echo "[$attempt/90] deploy state for this commit: $state"
            case "$state" in
              finished) deploy_finished=1; break ;;
              dead) echo '::error::Every Coolify deployment for this commit failed or was cancelled'; exit 1 ;;
            esac
          done
          [ "$deploy_finished" = 1 ] || { echo "::error::Deploy timeout; last state: $state"; exit 1; }

      - name: Verify exact runtime SHA and application health
        env:
          EXPECTED_SHA: ${{ github.sha }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          version_file=$(mktemp)
          data_file=$(mktemp)
          library_file=$(mktemp)
          access_header_file=$(mktemp)
          trap 'rm -f "$version_file" "$data_file" "$library_file" "$access_header_file"' EXIT
          case "$CF_ID" in ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client ID'; exit 1 ;; esac
          case "$CF_SECRET" in ''|*$'\r'*|*$'\n'*) echo '::error::Invalid Cloudflare Access client secret'; exit 1 ;; esac
          (umask 077; {
            printf 'CF-Access-Client-Id: %s\n' "$CF_ID"
            printf 'CF-Access-Client-Secret: %s\n' "$CF_SECRET"
          } > "$access_header_file")
          chmod 600 "$access_header_file"
          unset CF_ID CF_SECRET

          for endpoint in version data-status library-analysis/status; do
            case "$endpoint" in
              version) output=$version_file ;;
              data-status) output=$data_file ;;
              library-analysis/status) output=$library_file ;;
            esac
            curl -fsS -m 20 --header "@$access_header_file" \
              "https://$APP_DOMAIN/api/$endpoint?deploy_check=$EXPECTED_SHA" > "$output"
          done

          python3 - "$version_file" "$data_file" "$library_file" "$EXPECTED_SHA" <<'PY'
          import json, sys
          version_path, data_path, library_path, expected_sha = sys.argv[1:]
          with open(version_path, encoding='utf-8') as handle: version = json.load(handle)
          with open(data_path, encoding='utf-8') as handle: data = json.load(handle)
          with open(library_path, encoding='utf-8') as handle: library = json.load(handle)
          actual_sha = version.get('sha')
          if actual_sha != expected_sha:
              raise SystemExit(f'/api/version SHA mismatch: {actual_sha} != {expected_sha}')
          required = ('ok', 'dbOk', 'pageGatesOk', 'knowledgeBaseGatesOk')
          failed = [flag for flag in required if data.get(flag) is not True]
          if failed:
              raise SystemExit(f'/api/data-status failed gates: {", ".join(failed)}')
          if library.get('operational') is not True:
              raise SystemExit('/api/library-analysis/status is not operationally healthy')
          print(f'Runtime proof PASS: {actual_sha}')
          PY
